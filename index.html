<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horgász kvíz – Halismeret</title>
<style>
  /* ============================================================
     ALAPSTÍLUSOK
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #0ea5e9;
    --primary-dark: #0284c7;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
    --border: #e2e8f0;
    --shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
    --radius: 18px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #e0f2fe 0%, #f1f5f9 60%, #e2e8f0 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    line-height: 1.5;
  }

  .app {
    width: 100%;
    max-width: 760px;
  }

  /* Fejléc */
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
  }

  /* Kártya */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: clamp(20px, 4vw, 36px);
  }

  /* ============================================================
     KEZDŐKÉPERNYŐ
     ============================================================ */
  .start-screen {
    text-align: center;
    padding: clamp(40px, 8vw, 72px) 24px;
  }
  .start-screen h2 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    margin-bottom: 12px;
  }
  .start-screen p {
    color: var(--muted);
    max-width: 460px;
    margin: 0 auto 32px;
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
  }

  .btn-start {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: clamp(1.1rem, 3vw, 1.35rem);
    font-weight: 700;
    padding: 18px 56px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .btn-start:hover { background: var(--primary-dark); transform: translateY(-2px); }
  .btn-start:active { transform: translateY(0); }

  /* ============================================================
     JÁTÉK KÉPERNYŐ
     ============================================================ */
  .game-screen { display: none; }
  .game-screen.active { display: block; }

  /* Hal képe */
  .fish-image-wrap {
    text-align: center;
    margin-bottom: 24px;
  }
  .fish-image {
    width: min(400px, 100%);
    height: auto;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(2, 6, 23, 0.12);
    object-fit: cover;
  }

  /* Válasz szekció */
  .question-section {
    margin-bottom: 22px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #f8fafc;
  }
  .question-section h3 {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text);
  }

  /* Válasz gombok (radio megoldás) */
  .options {
    display: grid;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    font-size: clamp(0.95rem, 2.6vw, 1.05rem);
  }
  .option:hover { border-color: var(--primary); }
  .option input { display: none; }
  .option .dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #cbd5e1;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .option.selected {
    border-color: var(--primary);
    background: #f0f9ff;
  }
  .option.selected .dot {
    border-color: var(--primary);
    background: var(--primary);
    box-shadow: inset 0 0 0 4px #fff;
  }
  /* Értékelés utáni állapotok */
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct .dot { border-color: var(--correct); background: var(--correct); box-shadow: inset 0 0 0 4px #fff; }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.wrong .dot { border-color: var(--wrong); background: var(--wrong); box-shadow: inset 0 0 0 4px #fff; }
  .option.disabled { cursor: default; }
  .option.disabled:hover { border-color: var(--border); }
  .option.correct:hover, .option.wrong:hover { border-color: inherit; }

  .feedback {
    margin-top: 10px;
    font-weight: 700;
    font-size: 0.98rem;
  }
  .feedback.ok { color: var(--correct); }
  .feedback.bad { color: var(--wrong); }

  /* OK gomb */
  .btn-ok {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 16px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn-ok:hover { background: var(--primary-dark); }
  .btn-ok:active { transform: scale(0.99); }
  .btn-ok:disabled { background: #cbd5e1; cursor: not-allowed; }

  /* Eredmény + pontszám */
  .result {
    margin-top: 22px;
    text-align: center;
    padding: 18px;
    border-radius: 14px;
    background: #f8fafc;
    border: 1px solid var(--border);
    display: none;
  }
  .result.active { display: block; }
  .score {
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    font-weight: 800;
    color: var(--text);
  }
  .btn-next {
    margin-top: 16px;
    background: #0f172a;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 14px 36px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-next:hover { background: #1e293b; }

  .hidden { display: none !important; }
</style>
</head>

/* ================================================================
   SEGÉDFÜGGVÉNYEK
   ================================================================ */

/**
 * Véletlenszerűen összekever egy tömb elemeit (Fisher–Yates algoritmus).
 * @param {Array} tomb
 * @returns {Array} az összekevert tömb
 */
function kever(tomb) {
  const masolat = [...tomb];
  for (let i = masolat.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [masolat[i], masolat[j]] = [masolat[j], masolat[i]];
  }
  return masolat;
}

/**
 * Véletlenszerűen kiválaszt n darab egyedi elemet egy tömbből
 * (ismétlődés nélkül).
 * @param {Array} forras
 * @param {number} n
 * @returns {Array}
 */
function veletlenElemek(forras, n) {
  return kever(forras).slice(0, n);
}

/**
 * Összeállítja egy kérdés válaszlehetőségeit:
 * a helyes válasz + 4 véletlenszerű, ismétlődés nélküli rossz válasz,
 * az egészet véletlenszerű sorrendben.
 * @param {string} helyes – a helyes válasz szövege
 * @param {Array} osszes – az összes lehetséges válasz (a helyessel együtt)
 * @returns {Array} 5 válaszlehetőség, összekeverve
 */
function valaszokOsszeallitasa(helyes, osszes) {
  // a rossz válaszok = az összes, kivéve a helyes,
  // majd az ismétlődések kiszűrése (Set) – így minden érték csak egyszer szerepel
  const rosszak = [...new Set(osszes.filter(x => x !== helyes))];
  const rosszNegy = veletlenElemek(rosszak, 4);
  return kever([helyes, ...rosszNegy]);
}

/**
 * Felépít egy válaszszekciót (HTML) a megadott adatokkal.
 * @param {HTMLElement} kontener – a szekció gyökér eleme
 * @param {string} cim – a kérdés címe (pl. "Hal neve")
 * @param {Array} valaszok – a 5 válaszlehetőség
 * @param {string} csoportNev – a radio gombok csoportneve
 * @param {Function} onValasztas – visszahívás, ha a játékos választ
 * @returns {Array<HTMLElement>} a válasz opció elemei
 */
function szekcioEpit(kontener, cim, valaszok, csoportNev, onValasztas) {
  kontener.innerHTML = "";
  kontener.innerHTML += `<h3>${cim}</h3><div class="options"></div>`;
  const optionsWrap = kontener.querySelector(".options");

  return valaszok.map((valasz, i) => {
    // minden opció egy címkézett radio gomb
    const opcio = document.createElement("label");
    opcio.className = "option";
    opcio.dataset.value = valasz;
    opcio.innerHTML = `
      <input type="radio" name="${csoportNev}" value="${valasz}" />
      <span class="dot"></span>
      <span class="label-text">${valasz}</span>
    `;
    opcio.querySelector("input").addEventListener("change", () => {
      // kijelöltség vizuális frissítése
      optionsWrap.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
      opcio.classList.add("selected");
      onValasztas(valasz);
    });
    optionsWrap.appendChild(opcio);
    return opcio;
  });
}

/* ================================================================
   JÁTÉKMENET FÜGGVÉNYEK
   ================================================================ */

/**
 * Új kört indít: véletlenszerű halat választ és felépíti a kérdéseket.
 */
function ujKorInditasa() {
  // állapot visszaállítása
  ertekelve = false;
  valasztottNev = null;
  valasztottTilalom = null;
  valasztottMeret = null;
  resultBox.classList.remove("active");
  okBtn.disabled = false;
  okBtn.textContent = "OK";

  // véletlenszerű hal kiválasztása
  aktualisHal = veletlenElemek(HAL_ADATBAZIS, 1)[0];
  fishImage.src = aktualisHal.kep;
  fishImage.alt = aktualisHal.nev;

  // összes lehetséges válasz előkészítése az adatbázisból
  const osszesNev     = HAL_ADATBAZIS.map(h => h.nev);
  const osszesTilalom = HAL_ADATBAZIS.map(h => h.tilalom);
  const osszesMeret   = HAL_ADATBAZIS.map(h => h.meret);

  // válaszlehetőségek összeállítása (helyes + 4 véletlen rossz, összekeverve)
  const nevValaszok     = valaszokOsszeallitasa(aktualisHal.nev, osszesNev);
  const tilalomValaszok = valaszokOsszeallitasa(aktualisHal.tilalom, osszesTilalom);
  const meretValaszok   = valaszokOsszeallitasa(aktualisHal.meret, osszesMeret);

  // szekciók felépítése
  szekcioEpit(sectionNev,     "1. Hal neve",            nevValaszok,     "nev",     v => valasztottNev = v);
  szekcioEpit(sectionTilalom, "2. Tilalmi idő",         tilalomValaszok, "tilalom", v => valasztottTilalom = v);
  szekcioEpit(sectionMeret,   "3. Méretkorlátozás",     meretValaszok,   "meret",   v => valasztottMeret = v);
}

/**
 * Egy szekció értékelése: jelöli a helyes/hibás választ,
 * és visszajelzést ír (✔ Helyes / ❌ Hibás + a helyes megoldás).
 * @param {Array<HTMLElement>} opciok – a szekció opció elemei
 * @param {string|null} valasztott – a játékos választása
 * @param {string} helyes – a helyes válasz
 * @returns {number} 1 ha helyes, 0 ha hibás
 */
function szekcioErtekeles(opciok, valasztott, helyes) {
  let pont = 0;

  opciok.forEach(opcio => {
    const value = opcio.dataset.value;
    opcio.classList.add("disabled");

    if (value === helyes) {
      opcio.classList.add("correct");
    }
    // a játékos által választott, de hibás opció
    if (value === valasztott && value !== helyes) {
      opcio.classList.add("wrong");
    }
  });

  // visszajelzés a szekció alatt
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  if (valasztott === helyes) {
    feedback.classList.add("ok");
    feedback.textContent = "✔ Helyes";
    pont = 1;
  } else {
    feedback.classList.add("bad");
    const valasztottSzoveg = valasztott ? `"${valasztott}"` : "nem adtál meg választ";
    feedback.innerHTML = `❌ Hibás. Válaszod: ${valasztottSzoveg}. A helyes válasz: <strong>${helyes}</strong>.`;
  }

  // a szekcióhoz csatoljuk a visszajelzést
  opciok[0].closest(".question-section").appendChild(feedback);
  return pont;
}

/**
 * Az OK gomb lenyomásakor lefut: mindhárom szekciót értékeli és kiírja a pontszámot.
 */
function ertekeles() {
  if (ertekelve) return;
  ertekelve = true;
  okBtn.disabled = true;
  okBtn.textContent = "Értékelve";

  const nevOpciok     = Array.from(sectionNev.querySelectorAll(".option"));
  const tilalomOpciok = Array.from(sectionTilalom.querySelectorAll(".option"));
  const meretOpciok   = Array.from(sectionMeret.querySelectorAll(".option"));

  // értékelés részenként
  const pontNev     = szekcioErtekeles(nevOpciok,     valasztottNev,     aktualisHal.nev);
  const pontTilalom = szekcioErtekeles(tilalomOpciok, valasztottTilalom, aktualisHal.tilalom);
  const pontMeret   = szekcioErtekeles(meretOpciok,   valasztottMeret,   aktualisHal.meret);

  const osszesPont = pontNev + pontTilalom + pontMeret;

  // pontszám megjelenítése
  scoreText.textContent = `Pontszám: ${osszesPont} / 3`;
  resultBox.classList.add("active");

  // görgetés az eredményhez
  resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ================================================================
   ESEMÉNYKEZELŐK
   ================================================================ */

// Start gomb: elrejti a kezdőképernyőt és elindítja a játékot
startBtn.addEventListener("click", () => {
  startScreen.classList.add("hidden");
  gameScreen.classList.add("active");
  ujKorInditasa();
});

// OK gomb: értékeli a válaszokat
okBtn.addEventListener("click", ertekeles);

// Következő hal gomb: új kört indít
nextBtn.addEventListener("click", ujKorInditasa);
</script>
